<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>

    <!-- Wall & Floor Gradients -->
    <linearGradient id="wall-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2e2a72" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="floor-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181538" />
      <stop offset="100%" stop-color="#0f0c24" />
    </linearGradient>

    <!-- Window Light Beam -->
    <linearGradient id="sunbeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#93c5fd" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#bfdbfe" stop-opacity="0" />
    </linearGradient>

    <!-- Bed Gradients -->
    <linearGradient id="bed-wood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="duvet-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="pillow-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Lamp Glow -->
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.75" />
      <stop offset="40%" stop-color="#fde047" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ca8a04" stop-opacity="0" />
    </radialGradient>

    <!-- Blueprint Grid Pattern -->
    <pattern id="grid-pattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Sky / Room Base -->
  <rect width="800" height="500" fill="url(#bg-grad-1)" />
  <rect width="800" height="360" fill="url(#wall-grad)" />
  <rect width="800" height="360" fill="url(#grid-pattern)" />

  <!-- Floor -->
  <polygon points="0,360 800,360 800,500 0,500" fill="url(#floor-grad)" />
  <!-- Floor Planks -->
  <line x1="0" y1="390" x2="800" y2="390" stroke="rgba(255,255,255,0.04)" stroke-width="1.5" />
  <line x1="0" y1="425" x2="800" y2="425" stroke="rgba(255,255,255,0.04)" stroke-width="1.5" />
  <line x1="0" y1="465" x2="800" y2="465" stroke="rgba(255,255,255,0.04)" stroke-width="1.5" />
  <line x1="220" y1="360" x2="160" y2="500" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
  <line x1="450" y1="360" x2="410" y2="500" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
  <line x1="680" y1="360" x2="660" y2="500" stroke="rgba(255,255,255,0.03)" stroke-width="1" />

  <!-- Left Window (Modern Arched Window) -->
  <g id="window">
    <rect x="50" y="60" width="160" height="240" rx="16" fill="#0f172a" stroke="rgba(255,255,255,0.2)" stroke-width="3" />
    <!-- City Silhouette Outside Window -->
    <path d="M 55,280 L 80,210 L 105,210 L 105,280 L 130,170 L 160,170 L 160,280 L 180,230 L 205,230 L 205,280 Z" fill="#1e293b" opacity="0.8" />
    <circle cx="160" cy="110" r="18" fill="#fde047" opacity="0.85" />
    <!-- Window Panes -->
    <line x1="130" y1="60" x2="130" y2="300" stroke="rgba(255,255,255,0.25)" stroke-width="2" />
    <line x1="50" y1="180" x2="210" y2="180" stroke="rgba(255,255,255,0.25)" stroke-width="2" />
    <!-- Window Sill -->
    <rect x="42" y="298" width="176" height="8" rx="3" fill="#cbd5e1" opacity="0.7" />
  </g>

  <!-- Sunbeam entering from window -->
  <polygon points="120,60 210,60 520,440 260,440" fill="url(#sunbeam)" />

  <!-- Wall Decor: Minimalist Floating Posters -->
  <g id="wall-art">
    <rect x="250" y="70" width="70" height="90" rx="4" fill="#0f172a" stroke="rgba(255,255,255,0.25)" stroke-width="2" />
    <circle cx="285" cy="105" r="18" fill="#f43f5e" opacity="0.8" />
    <polygon points="265,145 305,145 285,115" fill="#fb923c" opacity="0.9" />

    <rect x="335" y="55" width="85" height="110" rx="4" fill="#0f172a" stroke="rgba(255,255,255,0.25)" stroke-width="2" />
    <path d="M 350,145 C 360,100 395,95 405,145 Z" fill="#38bdf8" opacity="0.8" />
    <circle cx="395" cy="85" r="10" fill="#a855f7" opacity="0.8" />
  </g>

  <!-- Floating Shelf with Books & Plant -->
  <g id="shelf">
    <rect x="440" y="110" width="130" height="7" rx="2" fill="url(#bed-wood)" />
    <!-- Books -->
    <rect x="455" y="85" width="10" height="25" rx="1" fill="#ec4899" />
    <rect x="467" y="80" width="12" height="30" rx="1" fill="#3b82f6" />
    <rect x="481" y="88" width="8" height="22" rx="1" fill="#10b981" />
    <!-- Small Plant -->
    <polygon points="525,110 545,110 542,95 528,95" fill="#f97316" />
    <circle cx="535" cy="88" r="9" fill="#22c55e" />
    <circle cx="530" cy="84" r="7" fill="#16a34a" />
    <circle cx="541" cy="84" r="7" fill="#4ade80" />
  </g>

  <!-- Modern Bed -->
  <g id="bed">
    <!-- Headboard -->
    <rect x="250" y="210" width="280" height="110" rx="8" fill="url(#bed-wood)" stroke="#5c2605" stroke-width="2" />
    <line x1="250" y1="260" x2="530" y2="260" stroke="#78350f" stroke-width="1.5" />
    <line x1="390" y1="210" x2="390" y2="320" stroke="#78350f" stroke-width="1.5" />

    <!-- Mattress Base -->
    <rect x="230" y="300" width="320" height="40" rx="6" fill="#475569" />

    <!-- Bed Pillows -->
    <rect x="260" y="270" width="90" height="45" rx="10" fill="url(#pillow-grad)" />
    <rect x="265" y="275" width="80" height="35" rx="8" fill="#bae6fd" opacity="0.3" />

    <rect x="370" y="270" width="90" height="45" rx="10" fill="url(#pillow-grad)" />
    <rect x="375" y="275" width="80" height="35" rx="8" fill="#bae6fd" opacity="0.3" />

    <!-- Main Duvet / Quilt -->
    <rect x="220" y="315" width="340" height="110" rx="14" fill="url(#duvet-grad)" />
    <!-- Duvet Fold / Texture -->
    <path d="M 220,345 Q 390,365 560,345 L 560,315 L 220,315 Z" fill="#94a3b8" opacity="0.35" />
    <!-- Bed Runner / Throw Blanket -->
    <rect x="220" y="380" width="340" height="40" fill="#3b82f6" opacity="0.9" />
    <!-- Bed Legs -->
    <rect x="240" y="420" width="12" height="24" rx="2" fill="#78350f" />
    <rect x="528" y="420" width="12" height="24" rx="2" fill="#78350f" />
  </g>

  <!-- Right Workstation: Desk, Laptop, Glow Lamp -->
  <g id="workstation">
    <!-- Desk Lamp Glow -->
    <circle cx="680" cy="225" r="90" fill="url(#lamp-glow)" />

    <!-- Desk Surface & Legs -->
    <rect x="580" y="270" width="170" height="12" rx="3" fill="url(#bed-wood)" />
    <rect x="590" y="282" width="8" height="130" rx="2" fill="#334155" />
    <rect x="735" y="282" width="8" height="130" rx="2" fill="#334155" />

    <!-- Desk Lamp -->
    <path d="M 695,270 L 695,240 L 675,225" fill="none" stroke="#f1f5f9" stroke-width="3" stroke-linecap="round" />
    <polygon points="665,220 685,215 680,235" fill="#fde047" stroke="#eab308" stroke-width="1.5" />
    <circle cx="675" cy="228" r="4" fill="#ffffff" />

    <!-- Laptop -->
    <polygon points="615,270 655,270 650,245 620,245" fill="#94a3b8" />
    <polygon points="621,247 649,247 646,267 618,267" fill="#38bdf8" opacity="0.9" />
    <rect x="610" y="268" width="50" height="3" rx="1" fill="#cbd5e1" />

    <!-- Notebook & Pen -->
    <rect x="668" y="266" width="18" height="2" fill="#e2e8f0" />
    <line x1="688" y1="266" x2="696" y2="266" stroke="#f43f5e" stroke-width="1.5" />

    <!-- Modern Desk Stool / Chair -->
    <rect x="625" y="325" width="55" height="10" rx="4" fill="#0284c7" />
    <line x1="635" y1="335" x2="628" y2="425" stroke="#475569" stroke-width="3.5" stroke-linecap="round" />
    <line x1="670" y1="335" x2="677" y2="425" stroke="#475569" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- Potted Fiddle Leaf Plant in Foreground -->
  <g id="plant">
    <polygon points="50,470 85,470 80,420 55,420" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
    <!-- Stems & Leaves -->
    <path d="M 68,420 Q 55,370 40,360" fill="none" stroke="#15803d" stroke-width="3" />
    <ellipse cx="40" cy="358" rx="16" ry="10" transform="rotate(-30 40 358)" fill="#22c55e" />

    <path d="M 68,420 Q 75,360 88,340" fill="none" stroke="#15803d" stroke-width="3" />
    <ellipse cx="88" cy="340" rx="18" ry="11" transform="rotate(25 88 340)" fill="#16a34a" />

    <path d="M 68,420 Q 68,340 68,320" fill="none" stroke="#15803d" stroke-width="3" />
    <ellipse cx="68" cy="320" rx="14" ry="20" fill="#4ade80" />
  </g>

</svg>
